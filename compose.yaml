# Cinco servicios del MVP. Solo la API publica un puerto (127.0.0.1); Kafka y PostgreSQL quedan internos.
# Los puntos de entrada de producer, consumer y api se crean en pasos posteriores de F2.

name: observatorio

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?definir en .env}
      POSTGRES_USER: ${POSTGRES_USER:?definir en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [observatorio]
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.2
    environment:
      # KRaft de un solo nodo (broker + controller)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Retención limitada (research R-004): 24 h, 100 MiB por partición, segmento de 6 h
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 104857600
      KAFKA_LOG_ROLL_HOURS: 6
      # Sin esta variable el broker escribe en /tmp/kafka-logs (dentro del contenedor, sin volumen) y se pierde al recrearlo
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      # Persistencia: mensajes y offsets de los grupos sobreviven a `docker compose down` (research R-010, decisión D4)
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [observatorio]
    restart: unless-stopped

  producer:
    build: ./backend
    image: ${BACKEND_IMAGE:-observatorio-backend}
    command: ["python", "-m", "observatorio.producer.main"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-terremotos.live}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?definir en .env}
      POSTGRES_USER: ${POSTGRES_USER:?definir en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      USGS_URL: ${USGS_URL:-https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson}
      USGS_INTERVAL_S: ${USGS_INTERVAL_S:-60}
      USGS_TIMEOUT_S: ${USGS_TIMEOUT_S:-20}
      USGS_MAX_REINTENTOS: ${USGS_MAX_REINTENTOS:-3}
      RETENCION_RESPUESTAS_DIAS: ${RETENCION_RESPUESTAS_DIAS:-3}
      RETENCION_CONSULTAS_DIAS: ${RETENCION_CONSULTAS_DIAS:-30}
      # true = publicación real en Kafka (activada en la tarea T026, con el consumidor definitivo desplegado);
      # false = modo seco: consulta y registra sin publicar ni marcar versiones
      INGESTA_PUBLICAR: ${INGESTA_PUBLICAR:-false}
      # Margen (s) de la detección de huecos de ingesta > 24 h (F4): se aplica por ambos lados del intervalo
      HUECO_MARGEN_S: ${HUECO_MARGEN_S:-21600}
      # Replay histórico aislado (F6, DG1/DG3): topic, grupo y parámetros propios; nunca coinciden con los del flujo en vivo (ConfigReplay lo comprueba)
      KAFKA_TOPIC_REPLAY: ${KAFKA_TOPIC_REPLAY:-terremotos.replay}
      KAFKA_CONSUMER_GROUP_REPLAY: ${KAFKA_CONSUMER_GROUP_REPLAY:-consumidor-replay}
      REPLAY_EVENTOS: ${REPLAY_EVENTOS:-30}
      REPLAY_INTERVALO_S: ${REPLAY_INTERVALO_S:-2}
      REPLAY_ESPERA_FINAL_S: ${REPLAY_ESPERA_FINAL_S:-10}
      REPLAY_ESPERA_MAX_S: ${REPLAY_ESPERA_MAX_S:-120}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [observatorio]
    restart: unless-stopped

  consumer:
    build: ./backend
    image: ${BACKEND_IMAGE:-observatorio-backend}
    command: ["python", "-m", "observatorio.consumer.main"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-terremotos.live}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-consumidor-live}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?definir en .env}
      POSTGRES_USER: ${POSTGRES_USER:?definir en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      CATALOGO_PATH: /datos/paises.geojson
      # Replay histórico aislado (F6, DG1/DG3): topic, grupo y parámetros propios; nunca coinciden con los del flujo en vivo (ConfigReplay lo comprueba)
      KAFKA_TOPIC_REPLAY: ${KAFKA_TOPIC_REPLAY:-terremotos.replay}
      KAFKA_CONSUMER_GROUP_REPLAY: ${KAFKA_CONSUMER_GROUP_REPLAY:-consumidor-replay}
      REPLAY_EVENTOS: ${REPLAY_EVENTOS:-30}
      REPLAY_INTERVALO_S: ${REPLAY_INTERVALO_S:-2}
      REPLAY_ESPERA_FINAL_S: ${REPLAY_ESPERA_FINAL_S:-10}
      REPLAY_ESPERA_MAX_S: ${REPLAY_ESPERA_MAX_S:-120}
    volumes:
      # Catálogo de países entregado (Natural Earth): solo lectura, nunca se copia ni se modifica (F4).
      - ./frontend/public/datos/paises.geojson:/datos/paises.geojson:ro
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [observatorio]
    restart: unless-stopped

  api:
    build: ./backend
    image: ${BACKEND_IMAGE:-observatorio-backend}
    command: ["uvicorn", "--factory", "observatorio.api.main:crear_app_desde_entorno", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?definir en .env}
      POSTGRES_USER: ${POSTGRES_USER:?definir en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:4200}
      API_MAX_EVENTOS: ${API_MAX_EVENTOS:-5000}
      API_MAX_VENTANA_HORAS: ${API_MAX_VENTANA_HORAS:-744}
      INGESTA_OBSOLETA_S: ${INGESTA_OBSOLETA_S:-300}
      API_STATEMENT_TIMEOUT_S: ${API_STATEMENT_TIMEOUT_S:-10}
      API_MARGEN_PUBLICACION_S: ${API_MARGEN_PUBLICACION_S:-900}
      API_CLAVE_ACCESO: ${API_CLAVE_ACCESO:-}  # F6 (FR-041): vacía = sin protección (local); con valor, /api/* exige la cabecera X-Observatorio-Clave
      API_DOCS: ${API_DOCS:-true}  # F6: false oculta /docs, /redoc y /openapi.json (API publicada por el túnel)
    ports:
      - "127.0.0.1:${API_PUERTO:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # F6 (FR-041): con la clave de acceso activa /api/salud responde 401 sin ella; el healthcheck usa la clave del propio entorno del contenedor (no se imprime)
      test: ["CMD", "python", "-c", "import os, urllib.request; r = urllib.request.Request('http://localhost:8000/api/salud'); k = os.environ.get('API_CLAVE_ACCESO'); k and r.add_header('X-Observatorio-Clave', k); urllib.request.urlopen(r, timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [observatorio]
    restart: unless-stopped

networks:
  observatorio:

volumes:
  pgdata:
  kafkadata:
